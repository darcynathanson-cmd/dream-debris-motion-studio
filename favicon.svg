<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="night" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#25162f"/>
      <stop offset="1" stop-color="#080711"/>
    </linearGradient>
    <linearGradient id="halo" x1="15" y1="13" x2="50" y2="53" gradientUnits="userSpaceOnUse">
      <stop stop-color="#efc3b2"/>
      <stop offset=".52" stop-color="#d8b2e4"/>
      <stop offset="1" stop-color="#86cbd0"/>
    </linearGradient>
    <radialGradient id="bloom">
      <stop stop-color="#d8b2e4" stop-opacity=".42"/>
      <stop offset="1" stop-color="#d8b2e4" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#night)"/>
  <circle cx="30" cy="31" r="27" fill="url(#bloom)" filter="url(#soft)"/>
  <ellipse cx="31" cy="33" rx="17.5" ry="22" fill="none" stroke="url(#halo)" stroke-width="3.25" stroke-linecap="round" opacity=".82" transform="rotate(-22 31 33)"/>
  <circle cx="18.5" cy="21" r="5.5" fill="#efc3b2" filter="url(#glow)"/>
  <circle cx="46" cy="17" r="3.75" fill="#86cbd0" filter="url(#glow)"/>
  <circle cx="35" cy="50" r="3" fill="#d8b2e4" filter="url(#glow)"/>
</svg>
